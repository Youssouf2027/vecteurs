[project]
name = "vecteurs"
version = "0.1.0"
description = "Décorateurs paramétrés avec état et gestionnaire de contexte transactionnel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
